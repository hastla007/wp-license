name: PHPUnit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: find src tests tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test

  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, openssl
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client subversion
      - run: composer install --no-interaction --prefer-dist
      - name: Install WordPress test library
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/scaffold-command/12391865aaa11b96bf040e20e0558d619b7dafd0/templates/install-wp-tests.sh -o /tmp/install-wp-tests.sh
          bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.8
      - name: Run WordPress integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration
