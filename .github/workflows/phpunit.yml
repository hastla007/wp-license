name: PHPUnit

# Tests: syntax + unit tests on every supported PHP version (8.5 and newer), and the
# WordPress/WooCommerce integration matrix on the minimum database servers (MySQL 9.7,
# MariaDB 12.3). Static analysis lives in quality.yml.
# See docs/QUALITY-GATES.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.php }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    # PHP 8.6 is a nightly build of setup-php until its release on 19 Nov 2026: shown, never fails the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Only supported versions: the declared minimum (`Requires PHP: 8.5`, MINVER-1) and newer.
        php: ["8.5"]
        experimental: [false]
        include:
          - { php: "8.6", experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, openssl, sodium
          tools: composer:v2
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      # No composer.lock is committed (dev-only dependencies, PHP matrix), so the key is composer.json + PHP version.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: composer lint
      - name: Unit tests
        run: composer test
      - name: Site URL rules without the intl extension
        run: php -d disable_functions=idn_to_ascii vendor/bin/phpunit --filter SiteUrl

  integration:
    name: integration (WP ${{ matrix.wp }}, WC ${{ matrix.wc }}, PHP ${{ matrix.php }}, ${{ matrix.db == 'mariadb' && 'MariaDB 12.3' || 'MySQL 9.7' }}, ${{ matrix.hpos == '1' && 'HPOS' || 'legacy orders' }}${{ matrix.multisite == '1' && ', multisite' || '' }}${{ matrix.experimental && ', experimental' || '' }})
    runs-on: ubuntu-latest
    # Only the PHP 8.6 cell is experimental: shown, but it never fails the run or wordpress-integration.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # Every cell runs the PHP minimum (`Requires PHP: 8.5`) on one of the minimum database servers,
        # MySQL 9.7 LTS or MariaDB 12.3 LTS (MINVER-1); older servers only get a warning in the plugin.
        include:
          # Declared minimums (owner decision of 17 Nov 2026, uniform for all Captain plugins):
          # `Requires at least: 7.0` (Requirements::MIN_WP; "7.0" installs the newest 7.0.x release)
          # and `WC requires at least: 11.2` (Requirements::MIN_WC), with the newest 11.2 release.
          - { wp: "7.0", wc: "11.2.2", php: "8.5", db: "mysql", hpos: "1" }
          - { wp: "7.0", wc: "11.2.2", php: "8.5", db: "mariadb", hpos: "0" }
          # Newest: latest WordPress, newest stable WooCommerce (keep in sync with DEFAULT_WC_VERSION
          # in bin/install-test-env.sh).
          - { wp: "latest", wc: "11.3.0", php: "8.5", db: "mysql", hpos: "0" }
          - { wp: "latest", wc: "11.3.0", php: "8.5", db: "mariadb", hpos: "1" }
          # Multisite network (docs/MULTISITE.md); the WordPress test library reads WP_MULTISITE.
          - { wp: "latest", wc: "11.3.0", php: "8.5", db: "mariadb", hpos: "1", multisite: "1" }
          # PHP 8.6: a nightly build of setup-php until its release on 19 Nov 2026, experimental.
          - { wp: "latest", wc: "11.3.0", php: "8.6", db: "mysql", hpos: "1", experimental: true }
    services:
      mysql:
        # Docker Hub tags mysql:9.7 and mariadb:12.3 (both present on 16 Nov 2026).
        image: ${{ matrix.db == 'mariadb' && 'mariadb:12.3' || 'mysql:9.7' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        # The MariaDB images have no mysqladmin since 11.0; they ship healthcheck.sh instead.
        options: >-
          --health-cmd="${{ matrix.db == 'mariadb' && 'healthcheck.sh --connect --innodb_initialized' || 'mysqladmin ping -h 127.0.0.1 -uroot -proot' }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      WPLC_TEST_HPOS: ${{ matrix.hpos }}
      WP_MULTISITE: ${{ matrix.multisite || '0' }}
      WPLC_EXPECT_WP_VERSION: ${{ matrix.wp }}
      WPLC_EXPECT_WC_VERSION: ${{ matrix.wc }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, intl, mbstring, openssl, sodium
          tools: composer:v2
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client subversion unzip
      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install WordPress, the test library and WooCommerce
        run: bash bin/install-test-env.sh wordpress_test root root 127.0.0.1 "${{ matrix.wp }}" "${{ matrix.wc }}"
      - name: Run integration tests
        run: composer test:integration

  # One stable check name for branch protection, independent of the matrix cells.
  wordpress-integration:
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Every integration matrix cell passed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "Integration matrix result: ${{ needs.integration.result }}"
            exit 1
          fi
