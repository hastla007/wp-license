name: Package

# Builds the plugin ZIP exactly like the release workflow (bin/build-zip.sh, PHP 8.5, the minimum) on every
# pull request, so packaging problems show up before a tag is pushed. Nothing is released; the
# ZIP is kept as a short-lived artifact for manual installation tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per pull request: a new push to the pull request cancels the run of the older commit.
# Runs on main (and started by hand) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
      # Version from wp-license.php (must equal WPLC_VERSION and the readme.txt Stable tag).
      - name: Build and verify the plugin ZIP
        run: bin/build-zip.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-license-captain-zip
          path: dist/
          retention-days: 7
          if-no-files-found: error
