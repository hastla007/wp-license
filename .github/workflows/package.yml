name: Package

# Builds the plugin ZIP exactly like the release workflow (bin/build-zip.sh, PHP 8.5, the minimum) on every
# pull request, so packaging problems show up before a tag is pushed. Nothing is released; the
# ZIP is kept as a short-lived artifact for manual installation tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
      # Version from wp-license.php (must equal WPLC_VERSION and the readme.txt Stable tag).
      - name: Build and verify the plugin ZIP
        run: bin/build-zip.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp-license-captain-zip
          path: dist/
          retention-days: 7
          if-no-files-found: error
