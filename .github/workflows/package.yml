name: Package

# Builds the plugin ZIP exactly like the release workflow (bin/build-zip.sh, PHP 7.4) on every
# pull request, so packaging problems show up before a tag is pushed. Nothing is released; the
# ZIP is kept as a short-lived artifact for manual installation tests.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2
      # Version from wp-license.php (must equal WPLC_VERSION and the readme.txt Stable tag).
      - name: Build and verify the plugin ZIP
        run: bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wp-license-captain-zip
          path: dist/
          retention-days: 7
          if-no-files-found: error
