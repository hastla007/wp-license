name: Release build

# Tag v1.2.3 (or v1.2.3-rc.1) on a commit whose Version header, WPLC_VERSION and readme.txt
# Stable tag are 1.2.3. The unit tests run first on the minimum PHP version (8.5); the package is
# built by bin/build-zip.sh, the same script the "Package" workflow runs on every pull request.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A release is only built from a commit that is part of main.
      - name: The tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main." >&2
            exit 1
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, openssl, sodium
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit

  # Builds with read access only; the job that may write to the repository runs no code of it.
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [ "${VERSION}" != "${VERSION%%-*}" ]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      # Checks tag = Version header = WPLC_VERSION = readme.txt Stable tag, builds the ZIP with
      # its .sha256 and verifies the contents (no development files, autoloader, translations).
      - name: Build and verify the plugin ZIP
        run: bin/build-zip.sh "${{ steps.version.outputs.version }}"

      - name: Upload the build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wp-license-captain-${{ steps.version.outputs.version }}
          path: |
            dist/wp-license-captain-${{ steps.version.outputs.version }}.zip
            dist/wp-license-captain-${{ steps.version.outputs.version }}.zip.sha256
            dist/license-client-*.zip
            dist/license-client-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the ZIP
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wp-license-captain-${{ needs.build.outputs.version }}
          path: dist

      - name: Attach the package to the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/wp-license-captain-${{ needs.build.outputs.version }}.zip
            dist/wp-license-captain-${{ needs.build.outputs.version }}.zip.sha256
            dist/license-client-*.zip
            dist/license-client-*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
