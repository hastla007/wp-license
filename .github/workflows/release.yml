name: Release build

# Tag v1.2.3 (or v1.2.3-rc.1) on a commit whose Version header, WPLC_VERSION and readme.txt
# Stable tag are 1.2.3. The unit tests run first on the minimum PHP version; the package is
# built by bin/build-zip.sh, the same script the "Package" workflow runs on every pull request.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2
          extensions: intl, mbstring, openssl, sodium
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the ZIP
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          if [ "${VERSION}" != "${VERSION%%-*}" ]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      # Checks tag = Version header = WPLC_VERSION = readme.txt Stable tag, builds the ZIP with
      # its .sha256 and verifies the contents (no development files, autoloader, translations).
      - name: Build and verify the plugin ZIP
        run: bin/build-zip.sh "${{ steps.version.outputs.version }}"

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-license-captain-${{ steps.version.outputs.version }}
          path: |
            dist/wp-license-captain-${{ steps.version.outputs.version }}.zip
            dist/wp-license-captain-${{ steps.version.outputs.version }}.zip.sha256
            dist/license-client-*.zip
            dist/license-client-*.zip.sha256
          if-no-files-found: error

      - name: Attach the package to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wp-license-captain-${{ steps.version.outputs.version }}.zip
            dist/wp-license-captain-${{ steps.version.outputs.version }}.zip.sha256
            dist/license-client-*.zip
            dist/license-client-*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
