name: Quality

# Static analysis. Tests (syntax, unit, integration) live in phpunit.yml.
# See docs/QUALITY-GATES.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per pull request: a new push to the pull request cancels the run of the older commit.
# Runs on main (and started by hand) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-php8.5-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Blocking: WordPress.Security.*, WordPress.DB.PreparedSQL*, PHPCompatibilityWP (8.5+).
      # Reviewed existing findings are listed in phpcs-baseline.json; any new finding fails.
      - name: Security and compatibility sniffs (blocking)
        run: composer phpcs:blocking
      # Advisory: the full WordPress-Extra + WordPress-Docs report. Never fails the job.
      - name: Coding standard report (advisory)
        continue-on-error: true
        run: vendor/bin/phpcs -q --report=summary --report-source

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-php8.5-${{ hashFiles('composer.json') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      # Level 5 on src/ and wp-license.php; phpstan-baseline.neon holds the reviewed existing errors.
      - name: PHPStan (blocking)
        run: composer phpstan
